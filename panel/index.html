<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Événements · MRD</title>
<link rel="icon" type="image/png" href="../public/Logo MRD V2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
<link rel="stylesheet" href="panel.css?v=20261021o">
</head>
<body class="session-checking">
<header class="topbar">
  <a class="home-icon" href="../" target="_self" aria-label="Retour au portail public" title="Portail public">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
  </a>
  <div class="brand">
    <img src="../public/Logo MRD V2.png" alt="">
    <div><strong>Événements</strong><span>Media Relations Division</span></div>
  </div>
  <div class="pages-dropdown">
    <button class="pages-trigger" id="pages-trigger" type="button" data-action="toggle-pages" aria-expanded="false" aria-controls="pages-menu">Espaces <span id="active-page-label">Événements</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7 5 5 5-5"/></svg></button>
    <nav class="pages-menu" id="pages-menu" hidden aria-label="Navigation principale">
      <button class="nav-item active" data-action="tab" data-tab="edit">Événements</button><button class="nav-item" data-action="tab" data-tab="publications">Publications</button>
      <button class="nav-item" data-action="tab" data-tab="portal">Portail</button>
      <button class="nav-item" data-action="tab" data-tab="effectif">Effectif</button>
      <button class="nav-item" data-action="tab" data-tab="logs" hidden>Logs</button>
      <button class="nav-item" data-action="tab" data-tab="access">Accès</button>
      
    </nav>
  </div>
  <div class="topbar-actions">
    <span class="draft" id="draft"></span>
    <button class="btn ghost theme-toggle" id="theme-toggle" data-action="theme" aria-label="Changer de thème" title="Changer de thème">☼ <span>Mode clair</span></button>
    <button class="btn ghost hide-compact" data-action="download-page">Télécharger</button>
    <div class="save-dropdown" id="save-actions">
      <button class="btn primary save-main" id="publish" data-action="save-draft">Enregistrer</button>
      <button class="btn primary save-caret" id="save-menu-trigger" type="button" data-action="toggle-save-menu" aria-label="Autres options d’enregistrement" aria-expanded="false" aria-controls="save-menu">▾</button>
      <div class="save-menu" id="save-menu" hidden>
        <button type="button" data-action="publish">Enregistrer et publier</button>
      </div>
    </div>
    <div class="profile-dropdown">
      <button class="profile-trigger" id="profile-trigger" type="button" data-action="toggle-profile" aria-label="Ouvrir le menu du profil" aria-expanded="false" aria-controls="profile-menu">
        <img id="profile-avatar" alt="" hidden>
        <svg id="profile-avatar-placeholder" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0"/></svg>
      </button>
      <div class="profile-menu" id="profile-menu" hidden>
        <div class="profile-menu-heading"><strong id="profile-menu-name">Mon compte</strong><small id="profile-menu-grade">Session sécurisée</small></div>
        <button type="button" data-action="tab" data-tab="profile">Mon profil</button>
        <button type="button" class="profile-logout" data-action="logout">Se déconnecter</button>
      </div>
    </div>
  </div>
</header>

<main class="layout">
  <div class="workspace">
    <div class="panel" id="edit"></div>
    <div class="panel" id="portal" hidden></div><div class="panel" id="publications" hidden></div><div class="panel" id="logs" hidden></div>
    <div class="panel" id="access" hidden></div>
    <div class="panel" id="effectif" hidden></div>
    <div class="panel" id="profile" hidden></div>
    
  </div>
  <aside class="preview" id="preview" hidden>
    <div class="preview-bar">
      <div class="seg">
        <button class="active" data-action="device" data-width="100%">Bureau</button>
        <button data-action="device" data-width="390px">Mobile</button>
      </div>
      <span class="url" id="url"></span>
    </div>
    <div class="stage">
      <div class="device" id="device-frame"><iframe id="pv" sandbox="allow-scripts" title="Aperçu de la page"></iframe></div>
    </div>
  </aside>
</main>

<div class="toasts" id="toasts"></div>
<div class="login-screen" id="login-screen">
  <form class="login-card" id="login-form">
    <div class="login-brand"><img src="../public/Logo MRD V2.png" alt="MRD"><div><strong>MRD WORKSPACE</strong><small>MEDIA RELATIONS DIVISION</small></div></div>
    <h1>Connexion sécurisée</h1>
    <p>Connecte-toi avec le compte MRD qui t’a été attribué. Les droits disponibles dépendent de ton grade.</p>
    <div class="field"><label for="login-user">Identifiant</label><input id="login-user" name="username" autocomplete="username" required maxlength="64"></div>
    <div class="field"><label for="login-pass">Mot de passe</label><input id="login-pass" name="password" type="password" autocomplete="current-password" required minlength="8"></div>
    <button class="btn primary" type="submit" id="login-submit">Se connecter</button>
    <div class="login-error" id="login-error" role="status"></div>
  </form>
</div>
<input type="file" id="file" name="event-json" accept=".json" hidden>
<input type="file" id="publication-file" accept="application/pdf,image/png,image/jpeg,image/webp" hidden><input type="file" id="avatar-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/fr.js"></script>
<script src="generator.js?v=20261018h"></script>
<script src="panel.js?v=20261021o"></script>
</body>
</html>
