name: Temporary follow-up formatter

on:
  push:
    branches:
      - hardening/worker-test-harness
    paths:
      - "worker/worker.js"
      - "worker/tests/**"
      - ".github/workflows/format-followup-once.yml"

permissions:
  contents: write

concurrency:
  group: format-followup-once
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Format updated Worker sources
        run: npx --yes prettier@3.9.6 --write worker/worker.js worker/tests/worker.test.js

      - name: Commit formatting changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/worker.js worker/tests/worker.test.js
          if git diff --cached --quiet; then
            echo "Sources were already formatted."
            exit 0
          fi
          git commit -m "style: format Worker test harness follow-up"
          git push origin HEAD
